# Levanta la aplicación completa: PostgreSQL + pgvector y el backend.
#
#   cp .env.example .env     # y rellena GEMINI_API_KEY, ADMIN_KEY y BOOTSTRAP_ADMIN_PASSWORD
#   docker compose up --build
#
# Después, abre http://localhost:8080 (usuario "admin" con BOOTSTRAP_ADMIN_PASSWORD).

name: asistente-contextual

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: asistente_contextual
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Sin puerto publicado: solo la aplicación accede a la base de datos
    # (y no choca con un Postgres local en el 5432).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asistente_contextual"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Falta GEMINI_API_KEY en .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_AUX_MODEL: ${GEMINI_AUX_MODEL:-gemini-3.5-flash-lite}
      # En modo producción no hay valores por defecto: la aplicación no arranca sin ellas
      ADMIN_KEY: ${ADMIN_KEY:?Falta ADMIN_KEY en .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Falta BOOTSTRAP_ADMIN_PASSWORD en .env}
      DB_URL: jdbc:postgresql://db:5432/asistente_contextual
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
  app-data:
